[project]
name = "oncall-copilot"
version = "0.1.0"
description = "Multi-agent incident response assistant (POC)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "langgraph>=1.0",
  "langsmith>=0.4",
  "pyyaml>=6",
  "rank-bm25>=0.2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["app", "app.api", "app.agents", "app.tools", "app.rag", "app.security", "simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
